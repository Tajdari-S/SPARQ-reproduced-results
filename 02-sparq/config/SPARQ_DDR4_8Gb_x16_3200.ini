; SPARQ configuration: DDR4-3200 x16, one PIM-enabled chip per rank.
; rows=65536, columns=1024 and cmd_queue_size=8 (RLU in-flight cap)
; correspond to Table 1 and Sec. 5.2.1 of the paper.
[dram_structure]
protocol = DDR4
bankgroups = 2
banks_per_group = 4
rows = 65536
columns = 1024
device_width = 16
; BL = 8
BL = 2

[timing]
tCK = 0.63
AL = 0
CL = 22
CWL = 16
tRCD = 22
tRP = 22
tRAS = 52
tRFC = 560
tRFC2 = 416
tRFC4 = 256
tREFI = 12480
tRPRE = 1
tWPRE = 1
tRRD_S = 9
tRRD_L = 11
tWTR_S = 4
tWTR_L = 12
tFAW = 48
tWR = 24
tWR2 = 25
tRTP = 12
; tCCD_S = 4
; tCCD_L = 8
;tCCD_S = 0
;tCCD_L = 2
tCCD_S = 1
tCCD_L = 2
tCKE = 8
tCKESR = 9
tXS = 576
tXP = 10
tRTRS = 1

; SPARQ: subarray compare + match-select delay, in cycles, added to tCCD_S/tCCD_L.
; With BL=2 the burst cycle is tCCD_S=1, so tCMP>0 makes the comparison the
; binding column-scheduling constraint (paper Sec. 5.3.4). tCMP=0 = main results.
tCMP = 0

[power]
VDD = 1.2
IDD0 = 95
IPP0 = 4.0
IDD2P = 25
IDD2N = 37
IDD3P = 47
IDD3N = 56
IDD4W = 278
IDD4R = 302
IDD5AB = 280
IDD6x = 30

[system]
; channel_size = 8192
channel_size = 16384
channels = 1
bus_width = 64
address_mapping = rochrababgco
queue_structure = PER_BANK
refresh_policy = RANK_LEVEL_STAGGERED
row_buf_policy = OPEN_PAGE
cmd_queue_size = 8
trans_queue_size = 32

[other]
epoch_period = 1587301
output_level = 1

