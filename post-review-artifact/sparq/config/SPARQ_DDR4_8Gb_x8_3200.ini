[system]
; 32 GiB channel = 4 ranks of 8 x 8 Gb chips, matching NumOfRanks = 4 in the x8 trace
; generator. The March 2025 run that produced Figures 7/10 had 4 ranks: its stats
; file and all 8 SF1/SF10 plotted bars re-simulate exactly with it. dramsimtest/ now
; sets 16384 (2 ranks), which aliases rank-2/3 addresses onto ranks 0/1 and
; inflates latency 11-18%.
